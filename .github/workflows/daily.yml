# 하루 세 번(한국 시각 07시·13시·19시): 사용자 데이터 내보내기 → 뉴스 수집·벡터·AI 요약 → Netlify 배포 (PLAN.md 7-7-1)
name: 하루 세 번 뉴스 갱신

on:
  schedule:
    # GitHub 예약은 UTC 기준 (한국 = UTC+9). GitHub 사정으로 몇 분~수십 분 늦을 수 있음
    - cron: "0 22 * * *"         # 한국 07:00
    - cron: "0 4 * * *"          # 한국 13:00
    - cron: "0 10 * * *"         # 한국 19:00
  workflow_dispatch:              # 손으로 실행
  push:
    branches: [main]
    paths: ["static/**", "netlify/**", "app/**", "pipeline/**", "netlify.toml", "package*.json", ".github/workflows/daily.yml"]

concurrency:
  group: daily-build              # 겹쳐 실행하지 않음
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: ${{ vars.SITE_URL }}                       # 예: https://내사이트.netlify.app (이전 데이터를 여기서 받음)
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EMBED_VARIANT: fp32                                  # Hugging Face API와 같은 벡터
      COLLECT_INTERVAL_HOURS: "6"                          # 6~12시간 간격 수집 → 시각 없는 기사는 시각을 숨김
    steps:
      - name: 설정 확인 (값은 출력하지 않고 비어 있는지만)
        env:
          OPENAI_API_KEY_SET: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          missing=""
          [ -z "$NETLIFY_SITE_ID" ] && missing="$missing NETLIFY_SITE_ID"
          [ -z "$NETLIFY_AUTH_TOKEN" ] && missing="$missing NETLIFY_AUTH_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets가 비어 있어요:$missing — Settings → Secrets and variables → Actions → Secrets 탭에 등록해 주세요 (Variables 탭이나 Environment secrets가 아님)"
            exit 1
          fi
          [ "$OPENAI_API_KEY_SET" = "true" ] || echo "::warning::OPENAI_API_KEY가 없어 AI 요약을 건너뜀 (Secrets 탭)"
          [ -n "$SITE_URL" ] || echo "::warning::SITE_URL(Variables 탭)이 없어 이전 데이터를 이어 받지 못하고 처음부터 만듦 — 첫 배포 뒤 꼭 등록"
          echo "설정 확인 완료"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 모델 파일 캐시 (e5-small 32비트 470MB, 매번 받지 않게)
        uses: actions/cache@v4
        with:
          path: models
          key: e5-small-fp32-v1

      - name: 패키지 설치
        run: |
          pip install -r requirements-pipeline.txt
          npm ci

      - name: Netlify Blobs에서 사용자 관심사·행동 기록 내보내기
        run: node pipeline/blobs.mjs export users.json

      - name: 데이터 만들기 (수집 → 벡터 → 사용자별 추천 후보 요약)
        run: python -m pipeline.build --prev "$SITE_URL" --users users.json --out static/data

      - name: 추천 일치 시험 (Python ↔ JavaScript)
        run: python -m tests.parity.run static/data

      - name: Netlify에 배포
        run: npx --yes netlify-cli@27.16.2 deploy --prod --dir static --functions netlify/functions --message "scheduled $(date -u +%Y-%m-%dT%H:%MZ)"
